<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Diario de Estudio</h1>
      <p class="subtitulo">Registra tus sesiones y mantén viva tu racha.</p>
    </header>

    <section class="tarjeta tarjeta-racha" aria-labelledby="titulo-racha">
      <p class="racha-etiqueta" id="titulo-racha">Racha actual</p>
      <p class="racha-valor">
        <span id="racha-numero">0</span>
        <span class="racha-fuego" aria-hidden="true">🔥</span>
      </p>
      <p class="racha-texto" id="racha-texto">días seguidos</p>
    </section>

    <section class="tarjeta" aria-labelledby="titulo-formulario">
      <h2 id="titulo-formulario">Nueva sesión</h2>

      <form class="formulario" id="formulario">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="campo">
          <label for="tema">Tema</label>
          <input
            type="text"
            id="tema"
            name="tema"
            placeholder="Ej.: Álgebra, React, Inglés"
            required
          >
        </div>

        <div class="campo">
          <label for="minutos">Minutos</label>
          <input
            type="number"
            id="minutos"
            name="minutos"
            min="1"
            step="1"
            inputmode="numeric"
            placeholder="30"
            required
          >
        </div>

        <p class="mensaje-error" id="mensaje-error" role="alert" hidden></p>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="tarjeta" aria-labelledby="titulo-sesiones">
      <h2 id="titulo-sesiones">Sesiones</h2>

      <p class="mensaje-vacio" id="mensaje-vacio">
        Todavía no has registrado ninguna sesión.
      </p>

      <ul class="lista-sesiones" id="lista-sesiones"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
